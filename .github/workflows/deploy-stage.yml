name: Deploy Stage

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          tags: |
            type=raw,value=stage
            type=sha,prefix=stage-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PRIVATE_ENCRYPTION_KEY=${{ secrets.NEXT_PRIVATE_ENCRYPTION_KEY }}
            NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY=${{ secrets.NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY }}

  deploy:
    runs-on: [self-hosted, stage]
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull latest code on stage server
        run: |
          set -e
          cd ~/JustX/JustX-signature
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin
          git reset --hard origin/main

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image and deploy
        run: |
          set -e
          cd ~/JustX/JustX-signature

          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Pull attempt $attempt of $max_attempts..."
            if timeout 600 docker pull ${IMAGE_NAME}:stage; then
              echo "Pull successful"
              break
            else
              if [ $attempt -eq $max_attempts ]; then
                echo "Pull failed after $max_attempts attempts"
                exit 1
              fi
              echo "Pull failed, retrying in 10 seconds..."
              sleep 10
              attempt=$((attempt + 1))
            fi
          done

          docker tag ${IMAGE_NAME}:stage ${IMAGE_NAME}:latest

          docker compose -f docker/production/compose.yml --env-file .env up -d documenso
          docker compose -f docker/production/compose.yml --env-file .env logs --tail=50 documenso
