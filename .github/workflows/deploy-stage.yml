name: Deploy Stage

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, stage]
    permissions:
      contents: read
    steps:
      - name: Pull latest code on stage server
        run: |
          set -e
          cd ~/JustX/JustX-signature
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin
          git reset --hard origin/main

      - name: Build image locally and deploy
        run: |
          set -e
          cd ~/JustX/JustX-signature
          docker compose -f docker/production/compose.yml --env-file .env build documenso
          docker compose -f docker/production/compose.yml --env-file .env up -d documenso
          docker compose -f docker/production/compose.yml --env-file .env logs --tail=50 documenso
